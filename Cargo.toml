[package]
name = "rise-distance"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "rise_distance"
crate-type = ["rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
egg = { path = "vendor/egg", version = "0.11", features = ["serde-1", "lp"] }
hashbrown = { version = "0.17", features = ["serde"] }
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
procfs = "0.18"
# log = "0.4"
num-bigint = { version = "0.5", features = ["serde", "rand_0_10"] }
num-rational = { version = "0.4", features = [ "serde"] }
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
foldhash = "0.2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# all = { level = "deny", priority = -2 }

redundant_closure_for_method_calls = "allow"
module_name_repetitions = "allow"

disallowed_types = "deny"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
get_unwrap = "warn"
map_err_ignore = "warn"
missing_const_for_fn = "warn"
needless_raw_strings = "warn"
pub_without_shorthand = "warn"
redundant_type_annotations = "warn"
# shadow_reuse = "warn"
shadow_same = "warn"
str_to_string = "warn"
string_add = "warn"
implicit_clone = "warn"
create_dir = "warn"
deref_by_slicing = "warn"
filetype_is_file = "warn"
format_push_string = "warn"
impl_trait_in_params = "warn"
semicolon_inside_block = "warn"
tests_outside_test_module = "warn"
todo = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
verbose_file_reads = "warn"
shadow_unrelated = "warn"

# [profile.release-with-debug]
# inherits = "release"
# debug = true

[profile.release]
# debug = 1
# TODO CONSIDER THIS FOR MEMORY CONSUMPTION
# panic = "immediate-abort"


