# name = "distance"
# path = "src/bin/distance.rs"

[[bin]]
name = "sample"
path = "src/bin/sample.rs"

[[bin]]
name = "attempt"
path = "src/bin/attempt.rs"

[[bin]]
name = "start"
path = "src/bin/start.rs"
