[project]
name = "rise-distance-analysis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "polars",
    "scikit-learn",
    "numpy",
    "onnxruntime",
    # Includes the ONNX 1.22 tree-attribute fix from upstream PR #1256.
    "skl2onnx @ git+https://github.com/onnx/sklearn-onnx.git@7d25c71ce24b2797e7a4bf3f518efef0e2397e9a",
    # "scipy",
    "jupyter",
    "tqdm",
    "diceware",
    "altair>=6.2.2",
    "vl-convert-python>=1.9.0.post1",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = ["pre-commit>=4.5.1", "ruff", "ty"]


# [[tool.uv.index]]
# name = "pytorch"
# url = "https://download.pytorch.org/whl/cu132"
# default = true

[tool.ruff]
line-length = 100
src = [".", "analysis", "scripts"]

[tool.ty.environment]
extra-paths = ["analysis", "scripts"]
