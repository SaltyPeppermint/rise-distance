[project]
name = "rise-distance-analysis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "polars>=2.2.0",
    "jupyter>=1.1.1",
    "tqdm>=4.70.1",
    "altair>=6.2.2",
    "vl-convert-python>=1.9.0.post1",
    "pydantic>=2.14.4",
]

[dependency-groups]
dev = ["pre-commit", "ruff", "ty"]

[tool.ruff]
line-length = 100
src = [".", "analysis", "scripts"]

[tool.ty.environment]
extra-paths = ["analysis", "scripts"]
